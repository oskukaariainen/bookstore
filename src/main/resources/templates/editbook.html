<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>Edit book</h1>

    <form th:object="${book}" th:action="@{/save}" method="post">


        <input type="hidden" th:field="*{id}" readonly />


        <label for="author">Author</label><br>
        <input type="text" id="author" th:field="*{author}" /><br><br>

        <label for="title">Title</label><br>
        <input type="text" id="title" th:field="*{title}" /><br><br>

        <label for="isbn">ISBN</label><br>
        <input type="text" id="isbn" th:field="*{isbn}" /><br><br>

        <label for="publicationYear">Year</label><br>
        <input type="text" id="publicationYear" th:field="*{publicationYear}" /><br><br>

        <label for="price">Price</label><br>
        <input type="text" id="price" th:field="*{price}" /><br><br>

        <div style="clear: both; display: block; height: 10px;"></div>
        <label for="catlist">Category</label>
        <select id="catlist" th:field="*{category}" class="form-control">
            <option th:each="category: ${categories}" th:value="${category.categoryid}" th:text="${category.name}">
            </option>
        </select>


        <div style="clear: both; display: block; height: 10px;"></div>
        <input type="submit" value="Save" />
    </form>

</body>

</html>
